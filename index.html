<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scooter Rental Store</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Scooter Rental Store</h1>

      <section class="product-form-section">
        <h2>Add Product</h2>

        <form id="product-form" novalidate>
          <div class="field-group">
            <label for="product-name">Name</label>
            <input id="product-name" name="name" type="text" />
            <p id="name-error" class="error-message" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="product-price">Price</label>
            <input id="product-price" name="price" type="number" min="0.01" step="0.01" />
            <p id="price-error" class="error-message" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="product-qty">Quantity</label>
            <input id="product-qty" name="qty" type="number" step="1" />
            <p id="qty-error" class="error-message" aria-live="polite"></p>
          </div>

          <button type="submit" class="submit-btn">Add Product</button>
        </form>
      </section>

      <section class="product-list-section">
        <h2>Products</h2>

        <table class="product-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="product-table-body"></tbody>
        </table>

        <div class="total-box">
          <span class="total-label">Total:</span>
          <span id="total-value">0 KZT</span>
        </div>
      </section>
    </main>

    <script src="./src/Store.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
